<!DOCTYPE html>
<html>
<head>
    <title>AI Tutor</title>

    <!-- Space Mono Font -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Space Mono', monospace;
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
            background: #0f0f14;
            color: #eaeaf0;
        }

        h1 {
            margin-bottom: 5px;
        }

        p {
            color: #9a9ab0;
            margin-bottom: 25px;
        }

        #chat-box {
            border: 1px solid #2a2a35;
            border-radius: 14px;
            height: 500px;
            overflow-y: scroll;
            padding: 20px;
            margin-bottom: 20px;
            background: #181820;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            margin: 6px 0;
            padding: 12px 16px;
            border-radius: 14px;
            max-width: 75%;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .user {
            background: #3a5cff;
            color: white;
            margin-left: auto;
            text-align: left;
        }

        .assistant {
            background: #26263a;
            color: #eaeaf0;
        }

        #input-area {
            display: flex;
            gap: 12px;
        }

        #user-input {
            flex: 1;
            padding: 14px;
            font-size: 0.95rem;
            font-family: 'Space Mono', monospace;
            border: 1px solid #2a2a35;
            border-radius: 12px;
            background: #181820;
            color: #eaeaf0;
            outline: none;
        }

        #user-input:focus {
            border: 1px solid #3a5cff;
        }

        #send-btn {
            padding: 14px 22px;
            font-size: 0.95rem;
            font-family: 'Space Mono', monospace;
            background: #3a5cff;
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #send-btn:disabled {
            background: #555;
            cursor: not-allowed;
        }

        /* Scrollbar styling */
        #chat-box::-webkit-scrollbar {
            width: 8px;
        }

        #chat-box::-webkit-scrollbar-thumb {
            background: #2a2a35;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>AI Tutor</h1>
    <p>Topic: <strong>{{ topic }}</strong> | Questions: <strong>{{ num_questions }}</strong></p>

    <div id="chat-box" data-initial-message='{{ initial_message | tojson }}'></div>

    <div id="input-area">
        <input type="text" id="user-input" placeholder="Type your response..." autofocus>
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        function addMessage(text, role) {
            const chatBox = document.getElementById("chat-box");
            const div = document.createElement("div");
            div.className = "message " + role;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Display initial tutor message on page load
        const initialMessage = document.getElementById("chat-box").dataset.initialMessage;
        if (initialMessage) {
            addMessage(JSON.parse(initialMessage), "assistant");
        }

        async function sendMessage() {
            const input = document.getElementById("user-input");
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, "user");
            input.value = "";
            document.getElementById("send-btn").disabled = true;

            const response = await fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message: message})
            });
            const data = await response.json();

            addMessage(data.reply, "assistant");
            document.getElementById("send-btn").disabled = false;
            input.focus();
        }

        // Send on Enter key
        document.getElementById("user-input")
            .addEventListener("keypress", function(e) {
                if (e.key === "Enter") sendMessage();
            });
    </script>
</body>
</html>
